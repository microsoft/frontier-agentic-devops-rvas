# CodeQL Analysis Workflow
# Builds a CodeQL database, runs security queries, and publishes results under
# Security > Code scanning alerts.
# Runs on main, participant and team branches, pull requests to main, manual
# dispatch, and a weekly schedule.
# Participants work in team-{your-team-name}/challenge-work or participant/{name}
# branches and validate fixes through pull requests to main. Findings appear in
# PR checks and Code scanning alerts; Copilot Autofix can suggest fixes.

name: "CodeQL Analysis"

on:
  push:
    branches:
      - "main"
      - "team-*/challenge-work"
      - "participant/**"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    # Catch new CodeQL patterns every Monday at 9:00 UTC.
    - cron: '0 9 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # CodeQL supports Ubuntu, Windows, and macOS. This job uses Ubuntu.
    runs-on: ubuntu-latest

    # Permissions required to upload CodeQL results to the Security tab.
    permissions:
      security-events: write   # Upload SARIF results
      packages: read           # Read private packages when configured
      actions: read            # Read Actions data for private repositories
      contents: read           # Check out the code

    strategy:
      fail-fast: false
      matrix:
        # Juice Shop is a Node.js (Express) and Angular (TypeScript) app.
        # CodeQL's "javascript-typescript" covers JavaScript and TypeScript.
        # Other supported languages: python, java-kotlin, csharp, go, ruby,
        # cpp, and swift.
        language: [ 'javascript-typescript' ]

    steps:
      # Step 1: Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v5

      # Step 2: Initialize CodeQL
      # Set up CodeQL and prepare the code database.
      # The 'queries' parameter adds queries beyond the default set.
      # Available suites include security-extended and security-and-quality.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Add vulnerability patterns beyond the default query set.
          queries: security-extended
          # Exclude compiled output that causes parser errors and duplicate findings.
          config-file: ./.github/codeql/codeql-config.yml

      # Step 3: Auto-build the project
      # CodeQL extracts JavaScript and TypeScript directly. For compiled
      # languages, this step compiles the code before analysis.
      - name: Auto-build
        uses: github/codeql-action/autobuild@v4

      # Step 4: Run CodeQL Analysis
      # Run the analysis and upload results to Security > Code scanning alerts.
      # Copilot Autofix can suggest fixes for many alerts.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
