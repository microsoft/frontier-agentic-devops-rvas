id: ghas-04
title: Fix Broken Access Control
module: ghas
track: security
difficulty: intermediate
duration_minutes: 90
prerequisites:
  - ghas-01
prerequisite_capabilities:
  - Juice Shop instance running (see modules/ghas/setup.md)
  - GitHub Advanced Security enabled on the org repo provisioned in S00
  - GitHub Copilot license assigned
  - Basic familiarity with Node.js/Express route middleware and authentication patterns
  - Completed S01 (attack surface overview) recommended
description: Find and fix broken access control vulnerabilities, including IDOR and missing authorization middleware, in Juice Shop backend routes. Enforce ownership and roles on the server, validate the fix, and record its scope, evidence, GHAS validation, owner, and expectations for human- and agent-authored changes in `modules/ghas/resources/ghas-governance-practice.template.md`.
