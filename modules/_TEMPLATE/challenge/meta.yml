# === Required ===
id: REPLACE-module-localid       # Globally unique. Convention: <module>-<local-id>
                                 # Examples: ghec-ch01, ghas-00, ghaw-01, sre-agent-00
title: "REPLACE: Short Activity Title"
module: REPLACE                  # One of: ghec | ghas | ghaw | sre-agent
track: REPLACE-track-slug        # See CONTRIBUTING.md for the module → track table
difficulty: beginner             # beginner | intermediate | advanced
duration_minutes: 60             # Estimated completion time for a delivery team member, in minutes

# === Independence fields ===
prerequisites:                   # Activity IDs that must be completed first. An empty list means none.
  []
prerequisite_capabilities:       # Required skills or access. Do not list activity IDs here.
  - "GitHub account"
  - "Basic Git knowledge"

# === Descriptive ===
description: "REPLACE: One-sentence customer adoption outcome for the catalog card."

tags:
  - REPLACE-tag-1
  - REPLACE-tag-2

# === Operational ===
app_dependency: none             # none | juice-shop | grubify-starter-lab | seed-repo
emu_compatible: true             # Can this run in an EMU-controlled organization?
min_environment: org             # org | repo | codespace | enterprise
provision_creates:               # Resources created by the setup script.
  - "REPLACE: describe any repos, boards, or resources created"

# === Attribution ===
source_repo: microsoft/REPLACE-source-repo
source_path: REPLACE/path/to/original/file.md
license: MIT

# === Optional ===
tier: core                       # core | stretch | bonus | setup
display_order: 10                # Catalog position when the activity ID order is not the intended order.
references:
  - https://docs.github.com/
# Other optional fields (outcomes, personas, business_value, adoption_stage) are
# documented in CONTRIBUTING.md. Add them only when the activity needs them.
