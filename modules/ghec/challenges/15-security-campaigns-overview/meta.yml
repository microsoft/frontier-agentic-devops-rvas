id: ghec-ch15
title: Security Campaigns & Overview
module: ghec
track: security
difficulty: advanced
duration_minutes: 120
prerequisites: []
prerequisite_capabilities:
- GitHub organization with org-owner rights
- GitHub Advanced Security license enabled on the org
- GitHub CLI (gh >= 2.x) installed
- git installed
- jq installed
description: "Set up an authorized security-overview rollout with a security configuration, an owned and time-bounded campaign, and remediation evidence. Use OWASP Juice Shop only as a sample test repository and preserve the tenant adoption decision."
tags:
- ghas
- security-overview
- security-campaigns
- remediation
- juice-shop
app_dependency: juice-shop
emu_compatible: true
min_environment: org
provision_creates:
- repo ghec-ch15-juice-shop (public, OWASP Juice Shop imported at v20.0.0, pulled from official source — never vendored)
- rich multi-tool alert corpus (CodeQL OWASP Top 10 + Dependabot vulnerable npm tree + secret scanning) to drive a security campaign
- own standalone alert volume — does NOT depend on ch12/ch13 having run (independence preserved)
tier: core
