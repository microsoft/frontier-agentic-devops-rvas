id: ghec-ch38
title: Golden-Path Repository Bootstrap
module: ghec
track: admin-governance
difficulty: advanced
duration_minutes: 240
prerequisites: []
prerequisite_capabilities:
- GitHub organization with org-owner rights
- GitHub CLI (gh >= 2.x) installed
- git installed
- jq installed
- Repository provisioned via activity setup script
description: "Create a governed repository bootstrap with an approved template, baseline files, ownership evidence, and a repeatable validation."
success_criteria:
- A golden-path bootstrap standard exists with owner, scope, required repository settings, files, and exception path.
- The sample template repository contains baseline README, CODEOWNERS, issue form, pull request template, and starter workflow guidance.
- A new repository is created from the approved template or a customer-owned equivalent.
- The new repository is validated against the baseline and gaps are recorded with owners.
- High-impact organization defaults or member-creation controls are changed only as explicit participant-approved steps, not by setup.
- Customer evidence names the authorized scope and owner, links the handover record, and states the next rollout decision.
tags:
- repository-templates
- bootstrap
- governance
- developer-experience
- repository-settings
app_dependency: none
emu_compatible: true
min_environment: org
provision_creates:
- repo ghec-ch38-golden-path-template (seeded template candidate with baseline files)
- repo ghec-ch38-bootstrap-candidate (empty validation target)
- printed template and repository baseline next steps
