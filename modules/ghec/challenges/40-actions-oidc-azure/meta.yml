id: ghec-ch40
title: Actions OIDC with Azure
module: ghec
track: automation-ai
difficulty: advanced
duration_minutes: 240
prerequisites: []
prerequisite_capabilities:
- GitHub organization with repository admin rights
- Azure subscription permissions to create or update an app registration and federated credential
- GitHub CLI (gh >= 2.x) installed
- git installed
- jq installed
- Repository provisioned via activity setup script
description: "Replace long-lived Azure deployment credentials with GitHub Actions OpenID Connect: design subject claims, configure Azure federated credentials explicitly, and validate a least-privilege login workflow."
success_criteria:
- Approved OIDC trust design records repository, branch or environment subject claims, audience, Azure tenant, subscription, and least-privilege role.
- Azure app registration, managed identity, or service principal has a federated credential configured by the participant, not by setup automation.
- Workflow grants `id-token: write` only to jobs that need cloud authentication.
- Workflow authenticates to Azure without storing a client secret in GitHub.
- Negative test shows an unauthorized branch, environment, or repository subject cannot obtain the intended Azure access.
- Governance evidence records cloud owner, GitHub owner, rotation/removal plan for old secrets, and next review.
- Customer-owned implementation evidence identifies the authorized scope, accountable owner, relevant risk controls, handover artefact, and next adoption, cutover, or rollout decision.
tags:
- actions
- oidc
- azure
- identity
- cloud-governance
app_dependency: none
emu_compatible: true
min_environment: org
provision_creates:
- repo ghec-ch40-oidc-azure (seeded OIDC workflow scaffold and trust-design checklist)
- repo environment ghec-ch40-prod (no Azure resources or credentials created)
- printed repository environment and Actions permissions snapshot
