id: ghec-ch10
title: Billing, Cost Centers & Usage
module: ghec
track: admin-governance
difficulty: advanced
duration_minutes: 240
prerequisites: []
prerequisite_capabilities:
- GitHub organization with org-owner rights
- GitHub CLI (gh >= 2.x) installed
- git installed
- jq installed
description: "Set up an authorized customer cost-governance baseline: inspect Actions, Packages, and Storage usage; set budgets and alerts; retrieve billing usage from the API; and produce a customer-owned cost report with an accountable owner. Prefer Ch52's landing-zone register (or an authorized enterprise export) as the source for enterprise-level cost-center allocation, distinct from this organization's implementation; fall back to an independent org-level budget with an explicit not-available record when Ch52 was not completed."
tags:
- billing
- usage
- cost-centers
- budgets
- reporting
app_dependency: none
emu_compatible: true
min_environment: org
provision_creates:
- repo ghec-ch10-usage-generator (tiny workflow_dispatch Actions workflow to generate small metered usage)
- repo ghec-ch10-cost-report (holds reconciliation script + final report)
- printed current usage snapshot (Actions minutes / storage from the API)
