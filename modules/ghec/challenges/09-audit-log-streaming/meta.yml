id: ghec-ch09
title: Audit Log & Streaming
module: ghec
track: admin-governance
difficulty: advanced
duration_minutes: 300
prerequisites: []
prerequisite_capabilities:
- GitHub organization with org-owner rights
- GitHub CLI (gh >= 2.x) installed
- git installed
- jq installed
description: "Set up an authorized customer audit-log investigation and export path using the organization audit-log UI, search syntax, and REST API. Prefer Ch52's landing-zone register (or an authorized enterprise export) as the source for the enterprise-level streaming/retention decision, distinct from this organization's implementation; fall back to an independent org-level export with an explicit not-available record when Ch52 was not completed. Preserve the repeatable query/export artefacts, accountable owner, and next adoption action."
tags:
