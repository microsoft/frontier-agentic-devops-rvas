id: ghec-ch18
title: Self-hosted and larger runners
module: ghec
track: automation-ai
difficulty: advanced
duration_minutes: 120
prerequisites: []
prerequisite_capabilities:
- GitHub organization with org-owner rights
- GitHub CLI (gh >= 2.x) installed
- git installed
- jq installed
- Approved CI repository, with a disposable isolated VM only for self-hosted testing
- Approved organization and repository scope for runner access
description: "Choose a runner and verify scoped access and host isolation when self-hosting."
tags:
- actions
- self-hosted-runners
- runner-groups
- hardening
- larger-runners
app_dependency: none
emu_compatible: true
min_environment: org
provision_creates:
- repo ghec-ch18-self-hosted-runners (seeded build)
- hosted.yml (ubuntu-latest) + self-hosted.yml (label-targeted, queued until runner exists)
- RUNNER-SETUP.md registration + hardening walkthrough (Linux/macOS/Windows)
- HARDENING.md checklist (service account, ephemeral, fork-PR risk, egress)
tier: stretch
source_repo: microsoft/frontier-agentic-devops-rvas
source_path: modules/ghec/challenges/18-self-hosted-runners/meta.yml
license: MIT
