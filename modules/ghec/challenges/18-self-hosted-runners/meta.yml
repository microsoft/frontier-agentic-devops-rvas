id: ghec-ch18
title: Self-Hosted & Larger Runners
module: ghec
track: automation-ai
difficulty: advanced
duration_minutes: 300
prerequisites: []
prerequisite_capabilities:
- GitHub organization with org-owner rights
- GitHub CLI (gh >= 2.x) installed
- git installed
- jq installed
- Repository provisioned via activity setup script
- Optional ghec-ch52 approved organization topology and cost/organization-scope decision, when already established for the customer
description: "Implement an authorized self-hosted runner in an organization runner group. Record label routing, hardening, scaling, isolation, ownership, and the rollout decision. Prefer ghec-ch52's organization topology and cost/organization-scope decision as the source for the org-vs-enterprise runner-group call when available; fall back to an independent recommendation, with an explicit not-available record for any enterprise runner policy that cannot be inspected."
tags:
- actions
- self-hosted-runners
- runner-groups
- hardening
- larger-runners
app_dependency: none
emu_compatible: true
min_environment: org
provision_creates:
- repo ghec-ch18-self-hosted-runners (seeded build)
- hosted.yml (ubuntu-latest) + self-hosted.yml (label-targeted, queued until runner exists)
- RUNNER-SETUP.md registration + hardening walkthrough (Linux/macOS/Windows)
- HARDENING.md checklist (service account, ephemeral, fork-PR risk, egress)
tier: core
source_repo: microsoft/frontier-agentic-devops-rvas
source_path: modules/ghec/challenges/18-self-hosted-runners/meta.yml
