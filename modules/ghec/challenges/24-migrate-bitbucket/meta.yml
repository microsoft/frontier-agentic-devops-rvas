id: ghec-ch24
title: Migrate Bitbucket to GitHub (Server & Cloud)
module: ghec
track: migration
difficulty: advanced
duration_minutes: 240
prerequisites: []
prerequisite_capabilities:
- GitHub org with org-owner rights
- Classic GitHub PAT
- 'Server/Data Center path: Bitbucket Server/Data Center 5.14+ instance with admin access, SSH/SFTP or SMB access, and blob storage using AWS S3, Azure Blob, or GitHub-owned storage'
- 'Cloud path: bitbucket.org repository and git CLI'
- GitHub CLI >= 2.4.0
- PowerShell because generated migration scripts are .ps1 files
description: "Migrate a Bitbucket Server/Data Center repository with `gh bbs2gh`, or mirror a Bitbucket Cloud repository as a source-history-only fallback."
tags:
- bitbucket
- github-enterprise-importer
- migration
- bbs2gh
- git-mirror
- pull-requests
app_dependency: none
emu_compatible: true
min_environment: org
provision_creates:
- GitHub destination repositories created by a customer practitioner during migration
- Temporary migration archive in Bitbucket shared home for Server/Data Center exports
- Temporary staging objects in AWS S3, Azure Blob, or GitHub-owned blob storage
source_repo: microsoft/frontier-agentic-devops-rvas
source_path: modules/ghec/challenges/24-migrate-bitbucket/meta.yml
license: MIT
tier: core
outcomes:
- platform-migration
personas:
- migration-lead
- platform-engineer
business_value:
- reduce-migration-risk
- accelerate-cutover
adoption_stage: pilot
