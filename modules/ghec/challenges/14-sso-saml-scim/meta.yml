id: ghec-ch14
title: SSO, SAML & SCIM Identity
module: ghec
track: security
difficulty: advanced
duration_minutes: 150
prerequisites: []
prerequisite_capabilities:
- GitHub organization with org-owner rights
- GitHub CLI (gh >= 2.x) installed
- git installed
- jq installed
- Optional ghec-ch52 approved identity-model decision (personal accounts vs SAML-restricted org vs EMU), when already established for the customer
description: "Set up an authorized SAML and SCIM identity integration in test mode before enforcement, with provisioning and deprovisioning evidence, an identity audit, and a tested rollback. This organization-scoped work does not substitute for an enterprise SSO, SCIM, or EMU decision."
tags:
