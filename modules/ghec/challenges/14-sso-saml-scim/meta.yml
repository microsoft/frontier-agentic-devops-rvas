app_dependency: none
emu_compatible: false
min_environment: org
provision_creates:
- repo ghec-ch14-identity-runbook (runbook for IdP SAML app settings, SCIM rollout checklist, join/leave test script)
- staged org-scoped identity settings reference (Authentication security page URL + SCIM API base) — SSO is NOT auto-enabled (that is the learning)
