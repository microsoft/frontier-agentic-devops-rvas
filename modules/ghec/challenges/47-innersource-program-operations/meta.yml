id: ghec-ch47
title: InnerSource Program Operations
module: ghec
track: developer-flow
difficulty: intermediate
duration_minutes: 210
prerequisites: []
prerequisite_capabilities:
- GitHub organization with org-owner or repository admin rights
- GitHub CLI (gh >= 2.x) installed
- git installed
- jq installed
- Repository provisioned via activity setup script
description: "Operate an InnerSource program with discoverable project metadata, contributor onboarding, maintainer response expectations, issue labels, and governance evidence."
success_criteria:
- An InnerSource program charter names scope, owner, participating repositories, maintainer expectations, and success metrics.
- A hub or pilot repository exposes README, CONTRIBUTING, CODEOWNERS, support path, and good-first-contribution guidance.
- Issues or discussions are labeled and triaged for contribution readiness, maintainers, and response SLA.
- Repository access, branch protection, and review expectations are documented without weakening production controls.
- Governance evidence records program owner, onboarding path, adoption metrics, exceptions, and next review.
- Customer-owned implementation evidence identifies the authorized scope, accountable owner, relevant risk controls, handover artefact, and next adoption, cutover, or rollout decision.
tags:
