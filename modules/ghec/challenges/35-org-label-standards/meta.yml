id: ghec-ch35
title: Organization Label Standards
module: ghec
track: admin-governance
difficulty: intermediate
duration_minutes: 180
prerequisites: []
prerequisite_capabilities:
- GitHub organization with org-owner rights
- GitHub CLI (gh >= 2.x) installed
- git installed
- jq installed
- Repository provisioned via activity setup script
description: "Define an authorized organization label taxonomy, set defaults for new repositories, reconcile an existing repository, and record ownership, exceptions, and rollout evidence."
success_criteria:
- An approved organization label taxonomy exists with names, descriptions, colors, owner, review cadence, and exception path.
- Organization default labels include the approved `type:`, `priority:`, `area:`, and `status:` dimensions.
- A newly created repository inherits the approved organization default labels.
- At least one existing repository is reconciled from inconsistent labels to the approved taxonomy.
- Customer evidence names the authorized scope and owner, links the relevant controls and handover record, and states the next rollout decision.
tags:
- labels
- organization-settings
- governance
- taxonomy
- default-labels
app_dependency: none
emu_compatible: true
min_environment: org
provision_creates:
- repo ghec-ch35-existing-service (seeded with inconsistent labels and issues)
- repo ghec-ch35-new-service (seeded after default-label validation target)
- printed organization default-label snapshot
