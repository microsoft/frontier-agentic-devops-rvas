id: ghec-ch16
title: REST & GraphQL API Automation
module: ghec
track: automation-ai
difficulty: beginner
duration_minutes: 180
prerequisites: []
prerequisite_capabilities:
- GitHub organization with org-owner rights
- GitHub CLI (gh >= 2.x) installed
- git installed
- jq installed
- Repository provisioned via activity setup script
description: "Set up an authorized customer GitHub API automation using REST and GraphQL reads and writes, pagination, idempotency, and rate-limit controls. Preserve the customer-owned automation, accountable owner, and rollout decision."
tags:
- rest-api
- graphql
- automation
- pagination
- projects-v2
app_dependency: none
emu_compatible: true
min_environment: org
provision_creates:
- repo ghec-ch16-rest-graphql-automation (seeded, src/ + docs/ layout)
- ~60 seeded issues in mixed states (open/closed, many unlabeled) for real pagination
- starter label set (bug, enhancement, triage, area:backend, area:docs) with deliberate gaps
- empty org Projects v2 board ghec-ch16-board to populate via GraphQL
tier: core
