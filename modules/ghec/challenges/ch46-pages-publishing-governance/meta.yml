id: ghec-ch46
title: Pages Publishing Governance
module: ghec
track: developer-flow
difficulty: intermediate
duration_minutes: 180
prerequisites: []
prerequisite_capabilities:
- GitHub organization with org-owner rights
- GitHub CLI (gh >= 2.x) installed
- git installed
- jq installed
- Repository provisioned via activity setup script
description: "Govern GitHub Pages publishing for organization repositories: decide the allowed publication policy, configure a repository-level Pages source, verify publication evidence, and document exceptions without setup mutating org-wide settings."
success_criteria:
- The current organization Pages publication policy is captured before any change.
- An approved policy decision records who may publish Pages sites, allowed visibility, exception path, and review cadence.
- Organization-wide Pages settings are changed only by an explicit participant step with org-owner approval, or a rollout proposal explains why they were not changed.
- A target repository has a Pages source or GitHub Actions publishing workflow configured according to the approved policy.
- Publication evidence includes the site URL, source branch or workflow run, visibility decision, and rollback owner.
- Governance evidence records owner, scope, exceptions, audit evidence, and next review.
- Customer-owned implementation evidence identifies the authorized scope, accountable owner, relevant risk controls, handover artefact, and next adoption, cutover, or rollout decision.
tags:
- pages
- publishing
- organization-settings
- governance
- audit-evidence
app_dependency: none
emu_compatible: true
min_environment: org
provision_creates:
- repo ghec-ch46-pages-site (seeded static Pages content and governance issue)
- printed organization Pages policy snapshot when readable
