id: ghec-ch02
title: Branches, pull requests and code review
module: ghec
track: developer-flow
difficulty: beginner
duration_minutes: 75
prerequisites: []
prerequisite_capabilities:
- Customer repository write access and an administrator for review rules
- Independent human reviewer with write access
- GitHub CLI (gh >= 2.x) installed
- git installed
- jq installed
- Reuse the Ch01 issue and Ch00 repository
description: "Set up branch and review rules for merging pull requests."
tags:
- pull-requests
- code-review
- codeowners
- branch-protection
- merge-conflicts
- innersource
app_dependency: none
emu_compatible: true
min_environment: org
provision_creates:
- repo ghec-ch02-pull-requests-code-review (seeded multi-file app on main)
- two feature branches with open PRs (one clean, one that will conflict)
- .github/pull_request_template.md placeholder
- directory layout for CODEOWNERS paths (no branch protection yet)
tier: core
