id: ghec-ch02
title: Branches, Pull Requests & Code Review
module: ghec
track: developer-flow
difficulty: beginner
duration_minutes: 180
prerequisites: []
prerequisite_capabilities:
- GitHub organization with org-owner rights
- GitHub CLI (gh >= 2.x) installed
- git installed
- jq installed
- Repository provisioned via activity setup script
description: "Set up an authorized customer pull-request governance baseline: feature branches, reviews, `CODEOWNERS`, required reviewers, merge-conflict resolution, and chosen merge strategies. Preserve the policy evidence, accountable owner, and rollout decision."
tags:
- pull-requests
- code-review
- codeowners
- branch-protection
- merge-conflicts
app_dependency: none
emu_compatible: true
min_environment: org
provision_creates:
- repo ghec-ch02-pull-requests-code-review (seeded multi-file app on main)
- two feature branches with open PRs (one clean, one that will conflict)
- .github/pull_request_template.md placeholder
- directory layout mapping cleanly to CODEOWNERS paths (no branch protection yet)
tier: core
source_repo: microsoft/frontier-agentic-devops-rvas
source_path: modules/ghec/challenges/02-pull-requests-code-review/meta.yml
license: MIT
references:
- https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/proposing-changes-to-your-work-with-pull-requests/about-pull-requests
- https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/about-code-owners
- https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches
- https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/configuring-pull-request-merges/about-merge-methods-on-github
- https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/reviewing-changes-in-pull-requests/about-pull-request-reviews
- https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/addressing-merge-conflicts/resolving-a-merge-conflict-using-the-command-line
