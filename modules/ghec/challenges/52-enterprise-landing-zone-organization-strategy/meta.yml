id: ghec-ch52
title: Enterprise Landing Zone & Organization Strategy
module: ghec
track: admin-governance
difficulty: advanced
duration_minutes: 300
prerequisites: []
prerequisite_capabilities:
- Enterprise owner access or an authorized enterprise-policy export
- Named executive sponsor and enterprise governance owner
- GitHub CLI (gh >= 2.x) installed
- jq installed
description: "Inspect the enterprise topology and propose a justified organization-boundary strategy: organization count and rationale, org charter and intake/retirement process, enterprise roles/teams model, delegation/inheritance matrix, and a populated governance settings register spanning identity, teams, org lifecycle, unaffiliated offboarding, restricted email, metadata/custom properties, data residency, app registrations, cost centers, Projects/Sponsors applicability, and broad policy domains."
