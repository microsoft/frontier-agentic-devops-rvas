name: Risk gate

# pull_request_target runs the base-branch copy of this file and script.
# It never checks out or runs code from the pull request.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: risk-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  risk-gate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Classify the pull request
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RULES: .github/risk-tiers.json
        run: node .github/scripts/risk-gate.cjs
      - name: Label the tier
        if: always() && steps.gate.outputs.tier != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TIER: ${{ steps.gate.outputs.tier }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          for t in low medium high; do gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "risk:$t" || true; done
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label "risk:$TIER"
      - name: Queue auto-merge for the low tier
        if: steps.gate.outputs.tier == 'low' && steps.gate.outputs.pass == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash
